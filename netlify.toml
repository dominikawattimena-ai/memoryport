[build]
publish="public"
functions="netlify/functions"

[[redirects]]
from="/.well-known/oauth-protected-resource"
to="/.netlify/functions/bridge"
status=200

[[redirects]]
from="/.well-known/oauth-authorization-server"
to="/.netlify/functions/bridge"
status=200

[[redirects]]
from="/mcp"
to="/.netlify/functions/bridge"
status=200
force=true

[[redirects]]
from="/authorize"
to="/.netlify/functions/bridge"
status=200
force=true

[[redirects]]
from="/token"
to="/.netlify/functions/bridge"
status=200
force=true
